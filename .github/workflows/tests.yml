# B5: run the unit tests on GitHub's servers after every push and pull request.
# The tests use small hand-made tables, so no data files are needed.
# TensorFlow and SHAP are skipped here: no test imports them, and they are slow to install.
name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (same version as the project's conda environment)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the packages the tests need
        run: |
          grep -v -E "^(tensorflow|shap)" requirements.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run the unit tests
        run: python -m unittest discover -s tests -t . -v